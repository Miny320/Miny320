name: Refresh profile

# Redraws the README images with fresh numbers.
# It runs once a day, when the words or the drawing code change, and on demand.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile.config.mjs'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch the numbers
        run: npm run fetch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Draw the images
        run: npm run build

      - name: Check the result
        run: npm run check

      - name: Publish when something changed
        run: |
          if [ -z "$(git status --porcelain -- README.md assets data)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git commit -m "Refresh profile numbers"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
